
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04010c">
<title>A Letter From My Heart</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #04010c;
  font-family: "Hind Siliguri", sans-serif;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
}

/* =========================
   COSMIC BACKGROUND
========================= */

#scene {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  animation: fadein 2.5s ease both;
  transition: opacity 1.5s, filter 1.5s, transform 2s;
}

@keyframes fadein {
  from { opacity: 0; }
  to { opacity: 1; }
}

body.stage2 #scene {
  opacity: .38;
  filter: blur(3px) brightness(.75);
  transform: scale(1.06);
}

.float {
  animation: fl 5s ease-in-out infinite;
}

.float.b {
  animation-duration: 6.5s;
  animation-delay: -2s;
}

@keyframes fl {
  50% { transform: translateY(-10px); }
}

.pulse {
  transform-origin: 230px 300px;
  animation: pl 3s ease-in-out infinite;
}

@keyframes pl {
  50% { transform: scale(1.15); opacity: .8; }
}

#rays {
  transform-origin: 230px 300px;
  animation: rot 70s linear infinite;
}

@keyframes rot {
  to { transform: rotate(360deg); }
}

.tw {
  animation: tw 2.5s ease-in-out infinite alternate;
}

@keyframes tw {
  from { opacity: .2; }
  to { opacity: 1; }
}

/* =========================
   LETTER PRESENTATION
========================= */

.letter {
  position: fixed;
  z-index: 10;
  left: 50%;
  top: 50%;

  width: min(86vw, 48vh, 390px);
  aspect-ratio: 2 / 3;

  transform: translate(-50%, -45%) scale(.82);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transition:
    opacity 1.2s ease,
    transform 1.2s cubic-bezier(.2,.8,.2,1),
    visibility 0s linear 1.2s;
}

body.stage2 .letter {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;

  transform: translate(-50%, -50%) scale(1);

  transition:
    opacity 1.2s ease,
    transform 1.2s cubic-bezier(.2,.8,.2,1),
    visibility 0s;
}

/* =========================
   ENVELOPE
========================= */

.env {
  position: absolute;
  inset: 18% 0 18%;
  overflow: visible;

  border: 1px solid rgba(218, 187, 121, .8);
  border-radius: 14px;

  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(255,255,255,.95),
      transparent 45%
    ),
    linear-gradient(
      140deg,
      #d9e9ff,
      #92b4e6 55%,
      #526fa8
    );

  box-shadow:
    0 0 22px rgba(100,157,255,.3),
    0 0 55px rgba(120,150,255,.24),
    inset 0 0 25px rgba(255,255,255,.4);

  cursor: pointer;
  -webkit-tap-highlight-color: transparent;

  transition:
    opacity .5s ease,
    transform .6s ease,
    visibility 0s;
}

.env::before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px solid rgba(255,255,255,.45);
  border-radius: 9px;
  pointer-events: none;
}

.env:hover {
  box-shadow:
    0 0 30px rgba(100,157,255,.45),
    0 0 65px rgba(120,150,255,.3);
}

.flap {
  position: absolute;
  inset: 0 0 auto;
  height: 56%;
  z-index: 2;

  background: linear-gradient(
    145deg,
    #f7fbff,
    #b9cff0 75%,
    #90aee0
  );

  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center;

  transition:
    transform .9s cubic-bezier(.2,.8,.2,1);
}

.seal {
  position: absolute;
  z-index: 3;
  left: 50%;
  top: 52%;

  width: 60px;
  height: 60px;
  transform: translate(-50%, -50%);

  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 27px;
  color: #6d4510;

  background: radial-gradient(
    circle at 35% 30%,
    #fff1b4,
    #e6b64f 55%,
    #94601b
  );

  border: 1px solid #ffe7a0;

  box-shadow:
    0 0 16px rgba(255,207,104,.75),
    0 0 35px rgba(255,185,65,.35);

  animation: sealp 1.8s ease-in-out infinite;
  transition: opacity .4s, transform .5s;
}

@keyframes sealp {
  50% {
    box-shadow:
      0 0 24px rgba(255,207,104,.95),
      0 0 42px rgba(255,185,65,.45);
  }
}

.tap {
  position: absolute;
  left: 0;
  right: 0;
  bottom: -53px;

  text-align: center;
  color: #ffe7ae;

  font-size: 16px;
  font-weight: 500;
  letter-spacing: 1px;

  text-shadow: 0 0 12px rgba(255,201,100,.6);
  animation: tw 1.5s ease-in-out infinite alternate;
}

/* =========================
   LETTER IMAGE
========================= */

.paper {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  display: block;
  object-fit: contain;
  object-position: center;

  border-radius: 14px;
  border: 1px solid rgba(222,190,119,.75);

  background: #080e20;

  box-shadow:
    0 0 25px rgba(110,155,255,.22),
    0 0 55px rgba(255,194,91,.22);

  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transform: scale(.88) translateY(12px);
  clip-path: inset(48% 0 48% 0 round 14px);

  transition:
    opacity .65s ease,
    transform 1.1s cubic-bezier(.2,.8,.2,1),
    clip-path 1.1s cubic-bezier(.2,.8,.2,1),
    visibility 0s linear 1.1s;
}

/* =========================
   OPENING ANIMATION
========================= */

.letter.open .flap {
  transform: rotateX(180deg);
}

.letter.open .seal {
  opacity: 0;
  transform: translate(-50%, -50%) scale(.4);
  pointer-events: none;
}

.letter.open .tap {
  opacity: 0;
  pointer-events: none;
}

.letter.open .env {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: scale(.94);

  transition:
    opacity .45s ease .55s,
    transform .45s ease .55s,
    visibility 0s linear 1s;
}

.letter.open .paper {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;

  transform: scale(1) translateY(0);
  clip-path: inset(0 round 14px);

  transition:
    opacity .65s ease .35s,
    transform 1.1s cubic-bezier(.2,.8,.2,1) .25s,
    clip-path 1.1s cubic-bezier(.2,.8,.2,1) .25s,
    visibility 0s;
}

/* =========================
   FALLBACK IF p7.png IS MISSING
========================= */

.paper-fallback {
  position: absolute;
  inset: 0;

  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 14px;

  padding: 24px;
  text-align: center;
  color: #f2e6cc;

  border: 1px solid #c9a75e;
  border-radius: 14px;

  background:
    radial-gradient(ellipse at top, #18294c, transparent 65%),
    linear-gradient(150deg, #0d1630, #050713);
}

.paper-fallback strong {
  font-size: 25px;
  color: #d8b46a;
}

.paper-fallback p {
  font-size: 15px;
  line-height: 1.8;
}

.paper-fallback small {
  color: #aebbd7;
  line-height: 1.7;
}

.letter.image-error .paper-fallback {
  display: flex;
}

.letter.image-error .paper {
  display: none;
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {
  .float, .tw, .pulse, #rays, .seal {
    animation-duration: 10s;
  }
}
</style>
</head>

<body>

<!-- =========================
     COSMIC SCENE
========================= -->

<svg id="scene" viewBox="0 0 400 700"
     preserveAspectRatio="xMidYMid slice"
     aria-hidden="true">

  <defs>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="sun">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".25" stop-color="#ffe9a8" stop-opacity=".9"/>
      <stop offset=".6" stop-color="#ffa63d" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff7a00" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ribbon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb84d" stop-opacity=".15"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity=".55"/>
    </linearGradient>

    <linearGradient id="paperBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3efff"/>
      <stop offset="1" stop-color="#8fb0e0"/>
    </linearGradient>

    <linearGradient id="paperWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6df"/>
      <stop offset="1" stop-color="#e2c98f"/>
    </linearGradient>

    <radialGradient id="seal">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#a8741a"/>
    </radialGradient>
  </defs>

  <rect width="400" height="700" fill="#05010f"/>

  <g filter="url(#blur)">
    <ellipse cx="60" cy="250" rx="130" ry="80"
             fill="#3a2a7a" opacity=".7"/>
    <ellipse cx="350" cy="190" rx="110" ry="70"
             fill="#8a4a9a" opacity=".55"/>
    <ellipse cx="330" cy="520" rx="120" ry="80"
             fill="#1d3a7a" opacity=".6"/>
    <ellipse cx="60" cy="600" rx="110" ry="70"
             fill="#4a2a6a" opacity=".5"/>
  </g>

  <g id="stars"></g>
  <g id="rays"></g>

  <circle class="pulse" cx="230" cy="300" r="150"
          fill="url(#sun)"/>

  <g id="stairs" filter="url(#glow)"></g>

  <path id="trail"
        d="M125,470 C120,330 225,365 275,190"
        fill="none" stroke="none"/>

  <g id="sparks"></g>

  <!-- Left floating envelope -->
  <g transform="translate(78,525) rotate(-22)">
    <g class="float">
      <circle r="75" fill="#3a7bff" opacity=".35" filter="url(#blur)"/>

      <g transform="rotate(-6)">
        <rect x="-32" y="-64" width="82" height="58"
              rx="3" fill="#f1f5fb"/>

        <g stroke="#6b7a99" stroke-width="1" opacity=".7">
          <line x1="-24" y1="-54" x2="42" y2="-54"/>
          <line x1="-24" y1="-46" x2="40" y2="-46"/>
          <line x1="-24" y1="-38" x2="42" y2="-38"/>
          <line x1="-24" y1="-30" x2="36" y2="-30"/>
          <line x1="-24" y1="-22" x2="40" y2="-22"/>
        </g>
      </g>

      <rect x="-56" y="-36" width="112" height="74"
            rx="4" fill="url(#paperBlue)"/>

      <polygon points="-56,-36 0,10 56,-36"
               fill="#eaf3ff" stroke="#9fb8e0"/>

      <circle cy="8" r="12" fill="url(#seal)"/>
      <circle cy="8" r="7" fill="none"
              stroke="#7a5210" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Right floating envelope -->
  <g transform="translate(310,165) rotate(20)">
    <g class="float b">
      <circle r="70" fill="#ffb347" opacity=".35" filter="url(#blur)"/>

      <rect x="-48" y="-32" width="96" height="64"
            rx="4" fill="url(#paperWarm)"/>

      <polygon points="-48,-32 0,6 48,-32"
               fill="#fffaf0" stroke="#d8bd80"/>

      <circle cy="4" r="10" fill="url(#seal)"/>
      <circle cy="4" r="6" fill="none"
              stroke="#7a5210" stroke-width="1.1"/>
    </g>
  </g>
</svg>

<!-- =========================
     LETTER ENVELOPE
========================= -->

<div class="letter" id="letter">

  <div class="env"
       id="env"
       role="button"
       tabindex="0"
       aria-label="চিঠি খোলো">

    <div class="flap"></div>
    <div class="seal">♥</div>

    <p class="tap">✦ ট্যাপ করে চিঠি খোলো ✦</p>
  </div>

  <!-- Keep p7.png in the same folder as this HTML -->
  <img
    class="paper"
    id="paper"
    src="p7.png"
    alt="জন্মদিনের বিশেষ চিঠি"
  >

  <!-- Shows if p7.png cannot be loaded -->
  <div class="paper-fallback" id="paperFallback">
    <strong>একটি বিশেষ চিঠি ❤️</strong>
    <p>তোমার জন্য এই চিঠিটি অপেক্ষা করছে।</p>
    <small>
      p7.png ফাইলটি এই HTML ফাইলের একই ফোল্ডারে রাখো।
      ফাইলের নাম ও বড়-ছোট অক্ষর মিলিয়ে দেখো।
    </small>
  </div>

</div>

<script>
"use strict";

const NS = "http://www.w3.org/2000/svg";

const el = (name, attrs = {}, parent) => {
  const node = document.createElementNS(NS, name);

  for (const key in attrs) {
    node.setAttribute(key, attrs[key]);
  }

  if (parent) parent.appendChild(node);
  return node;
};

const R = (a, b) => a + Math.random() * (b - a);

/* =========================
   STARS
========================= */

const starGroup = document.getElementById("stars");

for (let i = 0; i < 140; i++) {
  const star = el("circle", {
    cx: R(0, 400),
    cy: R(0, 700),
    r: R(.4, 1.5),
    fill: "#fff"
  }, starGroup);

  star.setAttribute("class", "tw");
  star.style.animationDelay = R(-3, 0) + "s";
  star.style.animationDuration = R(1.5, 4) + "s";
}

/* =========================
   GOLDEN RAYS
========================= */

const rayGroup = document.getElementById("rays");

for (let i = 0; i < 26; i++) {
  const angle = R(0, Math.PI * 2);
  const width = R(.01, .035);
  const radius = 700;

  el("polygon", {
    points: `230,300
      ${230 + Math.cos(angle - width) * radius},
      ${300 + Math.sin(angle - width) * radius}
      ${230 + Math.cos(angle + width) * radius},
      ${300 + Math.sin(angle + width) * radius}`,
    fill: "#ffd98a",
    opacity: R(.05, .14)
  }, rayGroup);
}

/* =========================
   GOLDEN LIGHT STAIRS
========================= */

const bez = (p, t) => {
  const u = 1 - t;

  return [
    u*u*u*p[0][0] + 3*u*u*t*p[1][0] +
    3*u*t*t*p[2][0] + t*t*t*p[3][0],

    u*u*u*p[0][1] + 3*u*u*t*p[1][1] +
    3*u*t*t*p[2][1] + t*t*t*p[3][1]
  ];
};

const L = [[-30,680],[70,560],[170,440],[224,338]];
const RR = [[190,730],[285,560],[245,440],[237,338]];

const stairs = document.getElementById("stairs");
const polygon = [];

for (let i = 0; i <= 40; i++) {
  polygon.push(bez(L, i / 40));
}

for (let i = 40; i >= 0; i--) {
  polygon.push(bez(RR, i / 40));
}

el("polygon", {
  points: polygon.map(p => p.join(",")).join(" "),
  fill: "url(#ribbon)"
}, stairs);

for (const curve of [L, RR]) {
  let d = "M" + bez(curve, 0).join(",");

  for (let i = 1; i <= 40; i++) {
    d += " L" + bez(curve, i / 40).join(",");
  }

  el("path", {
    d,
    fill: "none",
    stroke: "#ffd98a",
    "stroke-width": 2.2
  }, stairs);
}

for (let i = 0; i <= 24; i++) {
  const t = 1 - Math.pow(1 - i / 24, 1.9);
  const a = bez(L, t);
  const b = bez(RR, t);

  el("line", {
    x1: a[0],
    y1: a[1],
    x2: b[0],
    y2: b[1],
    stroke: "#ffe9a8",
    "stroke-width": .6 + 2.6 * (1 - t)
  }, stairs);
}

for (let i = 0; i < 40; i++) {
  const t = R(.05, 1);
  const a = bez(L, t);
  const b = bez(RR, t);
  const k = Math.random();

  const star = el("circle", {
    cx: a[0] + (b[0] - a[0]) * k,
    cy: a[1] + (b[1] - a[1]) * k,
    r: R(.6, 1.8),
    fill: "#fff"
  }, stairs);

  star.setAttribute("class", "tw");
  star.style.animationDelay = R(-3, 0) + "s";
}

/* =========================
   GOLDEN TRAIL PARTICLES
========================= */

const sparks = document.getElementById("sparks");

for (let i = 0; i < 80; i++) {
  const duration = R(3, 6);

  const group = el("g", {
    transform: `translate(${R(-14,14)},${R(-14,14)})`
  }, sparks);

  const circle = el("circle", {
    r: R(.7, 2.4),
    fill: Math.random() < .2 ? "#8fd0ff" : "#ffd98a"
  }, group);

  const motion = el("animateMotion", {
    dur: duration + "s",
    begin: -R(0, duration) + "s",
    repeatCount: "indefinite"
  }, circle);

  el("mpath", { href: "#trail" }, motion);

  el("animate", {
    attributeName: "opacity",
    values: "0;1;1;0",
    keyTimes: "0;.2;.7;1",
    dur: duration + "s",
    begin: -R(0, duration) + "s",
    repeatCount: "indefinite"
  }, circle);
}

/* =========================
   LETTER IMAGE CHECK
========================= */

const letter = document.getElementById("letter");
const envelope = document.getElementById("env");
const paper = document.getElementById("paper");

function checkPaperImage() {
  if (paper.naturalWidth > 0) {
    letter.classList.remove("image-error");
  } else {
    letter.classList.add("image-error");
  }
}

paper.addEventListener("load", checkPaperImage);

paper.addEventListener("error", () => {
  letter.classList.add("image-error");
});

/* Handle images that loaded before the listener */
if (paper.complete) {
  checkPaperImage();
}

/* =========================
   SHOW THE ENVELOPE
   Change 5000 to adjust timing
========================= */

setTimeout(() => {
  document.body.classList.add("stage2");
}, 5000);

/* =========================
   OPEN THE LETTER
========================= */

function openLetter() {
  if (!document.body.classList.contains("stage2")) return;
  if (letter.classList.contains("open")) return;

  letter.classList.add("open");
  envelope.setAttribute("aria-label", "চিঠি খোলা হয়েছে");

  checkPaperImage();
}

envelope.addEventListener("click", openLetter);

envelope.addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    openLetter();
  }
});
</script>

</body>
</html>
