<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#02050f}

  /* দরজা ধীরে ধীরে খুলবে */
  .door{position:fixed;inset:0;background:url(p5.jpg) center/cover no-repeat;
    animation:open 5s ease-out forwards}
  @keyframes open{
    0%{filter:brightness(.1) blur(6px);transform:scale(1.35)}
    60%{filter:brightness(.8) blur(1px)}
    100%{filter:brightness(1) blur(0);transform:scale(1)}}
  .shade{position:fixed;inset:0;
    background:linear-gradient(rgba(2,5,15,.7),transparent 45%,rgba(2,5,15,.35))}

  /* দরজার আলোয় হঠাৎ বিস্ফোরণের ঝলক */
  .flash{position:fixed;left:47%;top:58%;width:60vmax;height:60vmax;margin:-30vmax 0 0 -30vmax;
    border-radius:50%;pointer-events:none;opacity:0;
    background:radial-gradient(circle,#fff 0%,#ffe9a8 18%,rgba(255,160,60,.55) 40%,transparent 68%);
    animation:flash 1.8s 3s ease-out both}
  @keyframes flash{
    0%{opacity:0;transform:scale(0)}
    15%{opacity:1}
    100%{opacity:0;transform:scale(1.6)}}

  /* দরজা থেকে ছিটকে ওঠা লেখা */
  .text{position:fixed;left:0;right:0;top:16vh;padding:0 14px;text-align:center;opacity:0;
    animation:burst 3.4s 3.2s cubic-bezier(.2,.9,.3,1.1) both}
  @keyframes burst{
    0%{opacity:0;transform:translateY(36vh) scale(.05);filter:blur(14px) brightness(4)}
    25%{opacity:1}
    60%{transform:translateY(0) scale(1.18);filter:blur(0) brightness(1.6)}
    100%{opacity:1;transform:none;filter:none}}

  .line{font-family:Orbitron,sans-serif;font-weight:900;text-transform:uppercase}
  .l1{font-size:clamp(1.1rem,5.6vw,1.9rem);letter-spacing:3px;margin-bottom:18px}
  .l2{font-size:clamp(1.5rem,8vw,2.8rem);letter-spacing:3px;line-height:1.3}
  .w{display:inline-block;white-space:nowrap;margin:0 .3em}

  /* প্রতিটি অক্ষরে আলাদা আলাদা রঙিন আলো */
  .l{display:inline-block;animation:lights 4s linear infinite}
  .l2 .l{animation:lights 4s linear infinite,tip 1.2s ease-in-out infinite alternate}
  @keyframes lights{
    0%  {color:#ff4fd8;text-shadow:0 0 10px #ff4fd8,0 0 28px #ff4fd8}
    20% {color:#ffd86b;text-shadow:0 0 10px #ffd86b,0 0 28px #ffb300}
    40% {color:#00ffe0;text-shadow:0 0 10px #00ffe0,0 0 28px #00bfff}
    60% {color:#7b9bff;text-shadow:0 0 10px #7b61ff,0 0 28px #7b61ff}
    80% {color:#ff6b6b;text-shadow:0 0 10px #ff3b3b,0 0 28px #ff3b3b}
    100%{color:#ff4fd8;text-shadow:0 0 10px #ff4fd8,0 0 28px #ff4fd8}}
  @keyframes tip{from{opacity:1}to{opacity:.55}}

  .spark{position:fixed;left:47%;top:58%;border-radius:50%;pointer-events:none}

  body.leave{animation:out 1.2s forwards}
  @keyframes out{to{opacity:0;filter:brightness(3)}}
</style>
</head>
<body>
  <div class="door"></div>
  <div class="shade"></div>
  <div class="flash"></div>

  <div class="text">
    <div class="line l1" id="l1">HAPPY BIRTHDAY TO</div>
    <div class="line l2" id="l2">"I"ΛΠVΞΞR ΛHI'II'IΞD</div>
  </div>

<script>
  /* প্রতিটি অক্ষরকে আলাদা করে রঙের দেরি দেওয়া হচ্ছে */
  let n=0;
  for(const id of["l1","l2"]){
    const box=document.getElementById(id),words=box.textContent.split(" ");
    box.textContent="";
    words.forEach(word=>{
      const w=document.createElement("span");w.className="w";
      for(const ch of word){
        const s=document.createElement("span");s.className="l";s.textContent=ch;
        s.style.animationDelay=(-n*0.22)+"s,"+(-n*0.17)+"s";n++;
        w.appendChild(s);
      }
      box.appendChild(w);
    });
  }

  /* দরজা থেকে রঙিন ঝিলিক ছিটকে বেরোবে (৩ সেকেন্ড পর) */
  const colors=["#ff4fd8","#ffd86b","#00ffe0","#7b61ff","#ff6b6b","#fff"];
  setTimeout(()=>{
    for(let i=0;i<80;i++){
      const s=document.createElement("div");s.className="spark";
      const z=2+Math.random()*5,c=colors[Math.random()*colors.length|0];
      s.style.cssText+=`width:${z}px;height:${z}px;background:${c};box-shadow:0 0 12px ${c}`;
      document.body.appendChild(s);
      const a=Math.random()*Math.PI*2,d=120+Math.random()*340;
      s.animate([
        {transform:"translate(0,0) scale(1)",opacity:1},
        {transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d-80}px) scale(.2)`,opacity:0}
      ],{duration:1400+Math.random()*1400,easing:"cubic-bezier(.1,.8,.3,1)"}).onfinish=()=>s.remove();
    }
  },3000);

  /* ১৪ সেকেন্ড পর নিজে নিজে পরের পেজ (page4) খুলবে */
  setTimeout(()=>{document.body.classList.add("leave");
    setTimeout(()=>location.href="page4.html",1200)},14000);
</script>
</body>
</html>
